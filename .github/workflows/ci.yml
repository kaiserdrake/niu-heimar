name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq
      - name: Render templates (dry run, no user settings)
        run: HOME="$RUNNER_TEMP/home" .claude-workspace/bin/install --no-user-settings --no-shell
      - name: Lint and test
        run: .claude-workspace/bin/workspace-lint
